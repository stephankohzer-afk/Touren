const COLS=["#c62f2a","#6b2fb3","#d9822b","#1f78b4","#2f7d4f","#a6366e","#0f8a8a","#7a5c2e"];
const fmt=(n,d=1)=>n.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const f0=n=>Math.round(n).toLocaleString("de-DE");
const hm=s=>{const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h+":"+String(m).padStart(2,"0")+" h"};
function dec(s,f){let i=0,v=[0,0];const o=[];while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);v[k]+=(r&1)?~(r>>1):(r>>1);}o.push([v[0]/f,v[1]/f]);}return o;}
document.getElementById("title").textContent=T.title;
document.getElementById("eyebrow").textContent=T.eyebrow;
document.getElementById("lead").textContent=T.lead;
const main=T.stages.filter(s=>!s.extra);
const sum=T.stages.reduce((a,s)=>({km:a.km+s.km,up:a.up+s.up,dn:a.dn+s.dn,mv:a.mv+s.dur}),{km:0,up:0,dn:0,mv:0});
document.getElementById("tot").innerHTML=`<span><b>${main.length}</b> Tage</span><span><b>${fmt(sum.km)}</b> km</span><span><b>${f0(sum.up)}</b> hm ↑</span><span><b>${f0(sum.dn)}</b> hm ↓</span><span><b>${hm(sum.mv)}</b> unterwegs</span><span>höchster Punkt <b>${f0(Math.max(...T.stages.map(s=>s.max)))} m</b></span>`;
const LK=[`<a href="${T.slug}-alle.gpx" download>GPX (alle Tage)</a>`];
if(T.source)LK.push(`<a href="${T.source.url}" target="_blank" rel="noopener">${T.source.label}</a>`);
if(T.planLink)LK.push(`<a href="${T.planLink.url}">${T.planLink.label}</a>`);
document.getElementById("links").innerHTML=LK.join("");

const map=L.map("map",{zoomSnap:.25}).setView([T.stages[0].start[0],T.stages[0].start[1]],12);
const topo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:'© <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA) · © <a href="https://www.openstreetmap.org/copyright">OSM</a>'}).addTo(map);
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Luftbild © Esri"});
L.control.layers({"Topo":topo,"OpenStreetMap":osm,"Luftbild":sat},null,{position:"topright"}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

const all=[],lines=[];
T.stages.forEach((s,i)=>{s.col=COLS[i%COLS.length];s.pts=dec(s.poly,1e5);all.push(...s.pts);
  const g=L.layerGroup([L.polyline(s.pts,{color:"#fff",weight:7,opacity:.85}),L.polyline(s.pts,{color:s.col,weight:4,dashArray:s.extra?"6 6":null})]).addTo(map);
  g.eachLayer(l=>l.on("click",()=>select(i,true)));lines.push(g);});
// huts / stage ends
const seen=new Set();
T.stages.forEach(s=>{[[s.start,s.from],[s.end,s.to]].forEach(([p,n])=>{if(seen.has(n))return;seen.add(n);
  L.marker(p,{icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[14,14]}),keyboard:false}).addTo(map).bindTooltip(n,{permanent:true,direction:"right",offset:[8,0],className:"lbl"});});});
// photos
(T.photos||[]).forEach(ph=>{L.marker([ph.lat,ph.lon],{icon:L.divIcon({className:"",html:`<div class="pphoto" style="background-image:url('${ph.thumb}')"></div>`,iconSize:[30,30]})}).addTo(map)
  .bindPopup(`<a href="${ph.src}" target="_blank"><img src="${ph.src}" alt="${ph.caption||""}"></a>${ph.caption?`<div style="margin-top:4px">${ph.caption}</div>`:""}`);});

function prof(s){const W=360,H=56,e=s.ele,n=e.length,mn=Math.min(...e),mx=Math.max(...e),r=Math.max(mx-mn,100);
  const x=i=>i/(n-1)*W,y=v=>4+(mx-v)/r*(H-14);const d=e.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Höhenprofil ${f0(mn)}–${f0(mx)} m"><path d="${d}L${W},${H}L0,${H}Z" fill="${s.col}" opacity=".16"/><path d="${d}" fill="none" stroke="${s.col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="2" y="${H-2}" font-size="10" fill="currentColor" opacity=".6" font-family="IBM Plex Mono,monospace">${f0(mn)}–${f0(mx)} m</text></svg>`;}
const daysEl=document.getElementById("days");
T.stages.forEach((s,i)=>{const p=s.plan;
  const pv=(v,u)=>v==null?"":`<div class="p">DAV ${typeof v=="number"?f0(v):v}${u||""}</div>`;
  const ig=(s.insta||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label||"Instagram"}</a>`).join("");
  const ph=(T.photos||[]).filter(x=>x.stage===i).map(x=>`<img src="${x.thumb}" alt="${x.caption||""}" loading="lazy">`).join("");
  const el=document.createElement("article");el.className="day";el.tabIndex=0;el.id="tag"+i;
  el.innerHTML=`<div class="hd"><span class="chip" style="background:${s.col}"></span><span class="d">${s.day}${s.extra?" · Zusatzrunde":""}</span><span class="dt">${s.date}</span></div>
   <div><div class="route">${s.from===s.to?(s.note||"Rundtour ab "+s.from):s.from+" → "+s.to}${s.toEle&&s.from!==s.to?` <span class="via">${f0(s.toEle)} m</span>`:""}</div>${s.via?`<div class="via">${s.via}</div>`:""}</div>
   <div class="stats"><div><div class="k">Strecke</div><div class="v">${fmt(s.km)} km</div>${p?pv(p.km==null?null:fmt(p.km,0)," km"):""}</div>
    <div><div class="k">Aufstieg</div><div class="v">${f0(s.up)} hm</div>${p?pv(p.up):""}</div>
    <div><div class="k">Abstieg</div><div class="v">${f0(s.dn)} hm</div>${p?pv(p.dn):""}</div>
    <div><div class="k">Unterwegs</div><div class="v">${hm(s.dur)}</div>${p?pv(p.time):""}</div></div>
   ${prof(s)}
   ${ph?`<div class="photos">${ph}</div>`:""}
   <div class="foot"><span class="note">höchster Punkt ${f0(s.max)} m</span><a href="${s.gpx}" download onclick="event.stopPropagation()">GPX</a>${ig}</div>`;
  el.addEventListener("click",()=>select(i,false));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(i,false)}});
  daysEl.appendChild(el);});
let cur=-1;
function select(i,scroll){if(cur===i){i=-1}cur=i;
  document.querySelectorAll(".day").forEach((d,k)=>d.classList.toggle("on",k===i));
  lines.forEach((g,k)=>g.eachLayer(l=>l.setStyle&&l.setStyle({opacity:(i<0||k===i)?(l.options.color==="#fff"?.85:1):.2})));
  map.fitBounds(L.latLngBounds(i<0?all:T.stages[i].pts),{padding:[24,24]});
  if(scroll&&i>=0)document.getElementById("tag"+i).scrollIntoView({behavior:"smooth",block:"nearest"});}
map.fitBounds(L.latLngBounds(all),{padding:[24,24]});
addEventListener("load",()=>map.invalidateSize());
</script>
